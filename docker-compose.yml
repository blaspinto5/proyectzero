services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: projectzero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/projectzero
    volumes:
      - ./output:/data
    # optionally: set restart policy or command override

volumes:
  db_data:
