<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80">
  <rect width="100%" height="100%" fill="#0b1226"/>
  <g font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#fff">
    <text x="16" y="24">Projectzero2 — scraping demo</text>
    <text x="16" y="44" font-size="12" fill="#9fb0ff">Scrapy + Playwright · pipelines · JSON/CSV/DB</text>
  </g>
  <!-- simple animated dots to simulate activity -->
  <g transform="translate(240,42)">
    <circle cx="0" cy="0" r="6" fill="#4fb3ff">
      <animate attributeName="cy" values="0;8;0" dur="1s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite" begin="0s" />
    </circle>
    <circle cx="18" cy="0" r="6" fill="#4fb3ff">
      <animate attributeName="cy" values="0;8;0" dur="1s" repeatCount="indefinite" begin="0.15s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite" begin="0.15s" />
    </circle>
    <circle cx="36" cy="0" r="6" fill="#4fb3ff">
      <animate attributeName="cy" values="0;8;0" dur="1s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite" begin="0.3s" />
    </circle>
  </g>
</svg>
